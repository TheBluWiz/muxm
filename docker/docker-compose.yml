# =============================================================================
#  MuxMaster (muxm) — Docker Compose configuration
#
#  HOW TO USE:
#    1. Run setup.sh (macOS/Linux) or setup.bat (Windows) once — it prepares
#       this folder and builds the image
#    2. Put your video files in the "input" folder (next to this file)
#    3. Run encode.sh / encode.bat for a guided encode, or drive muxm directly:
#         docker compose run --rm muxm --profile atv-directplay-hq /media/input/movie.mkv /media/output/movie.mp4
#    4. Your encoded file appears in the "output" folder
#
#  Inside the container your folders are /media/input and /media/output —
#  always use those paths in commands, never host paths like C:\... or ~/.
# =============================================================================

services:
  muxm:
    image: muxm:latest
    build: .
    # Run muxm under an init process (tini) instead of as PID 1. A hard-killed
    # encode (docker kill, Docker Desktop update/crash, `wsl --shutdown`) skips
    # muxm's cleanup and leaves output/.<name>.lock recording muxm's PID. As
    # PID 1 that PID is always "alive" (kill -0 1 succeeds), so the next run
    # could never reclaim the stale lock. With init, muxm gets a varying PID
    # and the stale-lock reclaim works again.
    init: true
    volumes:
      - ./input:/media/input
      - ./output:/media/output

      # Optional: mount a .muxmrc config file from your computer.
      # /media is muxm's working directory in the container, so this lands in
      # the project-level config tier — it applies no matter which user the
      # container runs as (unlike /root/.muxmrc, which non-root runs ignore).
      # NOTE: .muxmrc is sourced as a shell script inside Linux, so it MUST use
      # Unix (LF) line endings. A Windows (CRLF) file breaks muxm on every run
      # (see "Using a Custom Config File" in DOCKER_WINDOWS_GUIDE.md).
      # Uncomment the line below if you have a custom config:
      # - ./.muxmrc:/media/.muxmrc:ro
